# Whether to print debug messages
# Warning: could be noisy!
debug: true

server:
  # Main Micropub server configuration
  micropub:
    # The externally available URL for Scribble
    # This is used for self-references, especially in the config endpoint
    public_url: "https://scribble.example.org"

    # Server binding configuration
    server:
      # What address to bind to?
      address: "0.0.0.0"

      # What port to bind to?
      port: 9000

    # Request payload limits
    limits:
      # How big can a normal request be at maximum? 2MB by default. You may wish to lower this.
      # This will apply to JSON and form encoded bodies, but does not apply to multipart (file upload) requests.
      max_payload_size: 2_000_000

      # How big can a file upload be at maximum? 10MB by default. You may wish to adjust this.
      max_file_size: 10_000_000

      # Required: memory cap used when parsing multipart requests (file uploads). Must be large enough to hold all parts' headers and non-file fields.
      max_multipart_mem: 20_000_000

  # Query server configuration
  query_server:
    # Whether to enable the query server. This is an optional server that permits reading data
    # outside of of the main Micropub endpoints, for use in static site generation or other
    # read-only scenarios.
    enabled: false

    # Server binding configuration
    server:
      # What address to bind to?
      address: "0.0.0.0"

      # What port to bind to? Must not be the same as the main server port.
      port: 9001

# Micropub configuration
micropub:
  # Your domain
  me_url: "https://example.org"

  # Where to validate incoming tokens
  # IndieAuth by default, or use your own
  token_endpoint: "https://tokens.indieauth.com/token"

content:
  # The full URL that your content will be accessible from. Supports some placeholders, including
  # {year}, {month}, {day}, and {slug}. Slug is always required, but may appear anywhere in the path.
  # This only affects URL generation; it does not affect storage structure. Your frontend must support
  # the same URL structure to serve the content correctly, else you'll get 404s.
  content_url: "https://example.org/{year}/{month}/{day}/{slug}"

  # Pagination settings for listing content
  pagination:
    # Whether to paginate source list queries (recommended; default true)
    enabled: true
    # How many items per page to return for a source list query
    per_page: 20
  
  # Which storage strategy to use for content storage (currently only "d1" is supported)
  strategy: d1

  # Configuration for the D1 content storage strategy
  d1:
    account_id: "your-account-id"
    database_id: "your-d1-database-id"
    api_token: "your-api-or-user-token"
    table_prefix: "scribble" # optional, defaults to "scribble"; final table becomes <prefix>_content; set to "" to use plain "content"
    endpoint: "https://api.cloudflare.com/client/v4" # optional override for testing/self-hosted proxies

media:
  # The full URL that your media will be accessible from. Supports some placeholders, including
  # {year}, {month}, {day}, {uuid}, and {ext}. UUID is always required, but may appear anywhere in 
  # the path. Ext is the file extension (automatically determined by content type), not including the 
  # leading dot (e.g., "jpg"). The path component (following the domain) generally becomes the object 
  # key in your storage backend. Your frontend must support the same URL structure to serve the media 
  # correctly, else you'll get 404s.
  media_url: "https://example.org/{year}/{month}/{day}/{uuid}.{ext}"

  # Which storage strategy to use for media storage (currently only "s3" is supported)
  strategy: s3

  # Configuration for the S3 media storage strategy
  s3:
    access_key_id: "replaceme"
    secret_key_id: "replaceme"
    region: "ap-southeast-1"
    bucket: "mybucket"
    endpoint: "https://s3.ap-southeast-1.amazonaws.com" # or your R2/Backblaze/MinIO endpoint
